# Calibration parameters. Nothing in this file is hard-coded in Python.
#
# Every number here must have a source line in docs/calibration.md, or be explicitly
# marked `swept: true` -- meaning we do not know it, no public measurement exists, and
# eval/sweep.py varies it rather than asserting a value. See docs/problem.md 10.

# T3.1 -- the channel ladder. cost_inr and efficacy_prior are per contact.
# `intrusive: false` channels do not consume the ask budget (docs/problem.md 5.3) but
# still incur fatigue.
#
# Costs are SWEPT, not sourced: the ordering is not in doubt and the magnitudes are
# plausible Indian rate-card figures, but no single published table covering all seven
# was found (docs/calibration.md 5). Efficacy figures are PRIORS and are labelled as
# such -- T2.8's sensitivity grid exists because of them.
#
# The loader rejects a table where any channel is DOMINATED (at least as expensive and
# no more effective than another). A dominated channel is one no optimiser would ever
# choose, which would make the multiple-choice knapsack quietly smaller than this file
# claims -- and channels exist here to make the allocation a choice rather than a sort.
#
# `letter` is not decoration. RBI's KYC (Amendment) Directions, 2025 require at least
# three intimations before a periodic-updation due date and three reminders after it,
# *each phase including at least one by letter* (docs/calibration.md 1.2). That is an
# adjacent obligation, not this system's own -- it governs KYC updation, not e-mandate
# re-consent -- but it establishes that a system modelling regulated Indian contact has
# to be able to express a letter at all.
channels:
  - {name: in_app,   cost_inr: 0.00,  efficacy_prior: 0.02, intrusive: false}
  - {name: email,    cost_inr: 0.05,  efficacy_prior: 0.03, intrusive: true}
  - {name: sms,      cost_inr: 0.15,  efficacy_prior: 0.05, intrusive: true}
  - {name: whatsapp, cost_inr: 0.35,  efficacy_prior: 0.09, intrusive: true}
  - {name: ivr,      cost_inr: 2.00,  efficacy_prior: 0.12, intrusive: true}
  - {name: letter,   cost_inr: 25.00, efficacy_prior: 0.15, intrusive: true}
  - {name: agent,    cost_inr: 40.00, efficacy_prior: 0.28, intrusive: true}

value:
  # LinkedIn KDD 2016 -- separate prices, never one netted number.
  mu_good_outcome: 1.0
  nu_complaint: 1.0
  # Twitter/X 2022 -- weight on reachability; also a sweep axis.
  alpha_reachability: 1.0
  # Duolingo KDD 2020 -- fatigue magnitude and half-life in days.
  gamma_fatigue: 25.0
  fatigue_half_life_days: 15
  # Duolingo KDD 2020 -- penalty for reusing the previous template. This is the one
  # place the LLM layer touches the optimiser's arithmetic: without it, T4.3's notice
  # composer is a nicer sentence with no consequence for the allocation.
  rho_template_reuse: 5.0

  # Chrome, USENIX Security 2021 (~300M users). A quieter permission surface lost 2-5%
  # of grants and avoided 17-31% of permanent refusals. The grant-loss half is already
  # in the channel table -- efficacy_prior runs 0.02 to 0.28 -- so only the avoided-harm
  # half is applied here, once per step down the cost ladder. 0.24 is the midpoint of
  # the published 17-31%. Chrome measured ONE step between two UIs, not a seven-rung
  # ladder; treating each rung as one Chrome-sized step is this project's extrapolation
  # and is recorded as such in docs/calibration.md 4.
  backfire_avoided_per_softer_step: 0.24

recovery:
  # q and r from docs/problem.md 6.2. q > r is enforced twice: in models.Mandate when a
  # mandate is built, and in policy/loader.RecoveryParams when this file is loaded.
  #
  # Measured in T1.2 -- see docs/mapping.md 2 for the definitions, the sensitivity
  # table, and the caveats. Both numbers are recovery within 84 days, which is
  # horizon.weeks below; a recovery the harness never lives to see must not be
  # counted in a parameter the harness consumes.
  after_lapse: 0.41          # q -- measured: 638,931 / 1,568,023 passive lapses = 0.407
  after_revocation: 0.08     # r -- swept: true, ceiling 0.29 measured (see below)
  #
  # q replaces a provisional 0.35 and is *worse* for this project, not better: lapsed
  # mandates self-heal more often than assumed, so the value of intervening on them is
  # correspondingly smaller.
  #
  # r stays swept. KKBox's nearest analogue -- recovery after an in-app cancellation,
  # where coverage actually ended -- is 0.29, but re-subscribing to a music app is one
  # tap, whereas a revoked UPI AutoPay mandate needs a fresh mandate and a fresh bank
  # authentication. 0.29 is therefore a ceiling on r, not a measurement of it. The
  # sweep runs over (0, 0.29], which is a data-backed interval rather than the open
  # (0, 1) it was before T1.2.
  swept_ceiling_after_revocation: 0.29

# T2.1 -- what an ask actually does. NONE of these are measured; no public dataset
# contains them (docs/problem.md 8, gap 3), and docs/calibration.md 4 lists them as swept.
# T2.8's sensitivity grid exists precisely because a point estimate here would be an
# invention carrying the whole result.
intervention:
  # Uplift. An ask does not convert a fixed share of everyone contacted -- it saves a
  # share of the deaths that would otherwise have happened, so it multiplies the hazard:
  #
  #     h_asked = h * (1 - uplift_scale * efficacy_prior[channel])
  #
  # Reading efficacy_prior as an absolute conversion rate instead would let an ask
  # "save" a mandate that was never going to die this week, which is how a simulator
  # ends up reporting a 40% lift. Adyen's ~6% contextual-bandit result is the sanity
  # check (docs/limitations.md); anything near 40% is a red flag, not a finding.
  uplift_scale: 1.0

  # Backfire compounds with contact COUNT, not with the calendar: the second message is
  # more irritating than the first regardless of which week it lands in. Geometric
  # interpolation between these two, so the nth ask carries
  #     b(n) = first * (twelfth / first) ^ ((n - 1) / 11)
  # The illustrative 0.6% -> 6% ladder is from docs/problem.md 5.1, which also notes
  # what it implies: contacting the whole book every week for 12 weeks causes roughly
  # 30% cumulative attrition by itself, while the SMS spend is still only ~18,000.
  backfire_first_ask: 0.006
  backfire_twelfth_ask: 0.06

  # Share of *natural* (un-asked) deaths that are revocations rather than lapses.
  # MEASURED, not swept: 478,962 revocations against 277,495 lapses in the person-period
  # frame (docs/mapping.md 5.6). A death caused by an ask is always a revocation, by
  # definition -- that is what backfire means.
  natural_revocation_share: 0.634

horizon:
  weeks: 12
  budget_inr_per_week: 500.0

# T1.3 -- the India mapping layer. KKBox is a Taiwanese music service in 2017; this
# system is about Indian recurring mandates in 2026. Every constant below is part of
# that bridge, and every one is a DECISION, not a measurement. Full argument and the
# alternatives rejected: docs/mapping.md 3.
india:
  # Snapshot the mandate book is built "as of". This is the horizon of
  # transactions.parquet; transactions_v2 (March 2017) is deliberately NOT merged and
  # is held back as out-of-time validation data. See docs/mapping.md 3.2.
  snapshot_date: 2017-02-28

  # NTD -> INR. Deliberately 1.0, which is NOT the FX rate (~2.7 INR/TWD in 2026).
  # KKBox's price ladder is 149/129/119/99 NTD; India's music-subscription ladder is
  # 149/129/119/99 INR (Spotify 119, YouTube Premium 129, JioSaavn/Gaana 99). Taking
  # the numeral as rupees lands on real Indian prices; taking the FX rate produces
  # ~400/month plans that no Indian music service charges, making every ARR number
  # implausible. This is a uniform linear scale on all value, so policy rankings and
  # the shape of the budget curve are unchanged by it -- only the rupee headline moves.
  ntd_to_inr: 1.0

  # Rail mix. KKBox never published what payment_method_id means, so the rail cannot be
  # recovered from the data -- it is ASSIGNED, deterministically from a hash of the
  # customer id so it is stable across runs. swept: true, and flagged as synthetic in
  # docs/model_card.md. Shares must sum to 1.
  rail_mix:
    upi_autopay: 0.55
    card: 0.25
    enach: 0.15
    ppi: 0.05

  # UPI AutoPay needs additional-factor authentication above this per-debit amount, so
  # mandates above it are assigned to another rail. SOURCED, not chosen: it is the
  # general AFA ceiling in RBI/DPSS/2026-27/396 (Digital Payments -- E-Mandate Framework,
  # 2026, 21 April 2026). The same circular exempts insurance premiums, mutual fund
  # subscriptions and credit card bills up to 1,00,000. See docs/calibration.md 1. At ntd_to_inr: 1.0 it binds on zero
  # rows: the largest per-debit amount in the built book is 210 (the largest amount
  # anywhere in the transaction log is 2,000, on plans no surviving mandate is on). It
  # is kept because ntd_to_inr is a knob: raise it and the rule starts doing work.
  upi_autopay_afa_threshold_inr: 15000.0

  # Mandate validity beyond the current cycle end. KKBox has no mandate-validity
  # column at all, so this is pure overlay. swept: true.
  mandate_validity_days: 730

  # R (reachability option value) as a fraction of L. No public measurement exists for
  # what an addressable channel to a customer is worth. swept: true.
  reachability_fraction_of_ltv: 0.15

  # `bd` (age) outside this range is not a plausible human age. 67.2% of members fall
  # outside it, and the valid share swings from 0.091 (registered_via 4, 2.79M members)
  # to 0.666 (registered_via 3, 1.64M) -- so its missingness encodes signup channel.
  # Nulled, not dropped, and not used as a model feature. See docs/mapping.md 3.6.
  plausible_age_years: [13, 90]

  # payment_plan_days = 0 on 870,124 rows (4%), 93% of them auto-renewing and paid --
  # a missing field, not a zero-day plan. Imputed; see docs/mapping.md 3.5.
  default_debit_frequency_days: 30

