name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen fails if uv.lock is stale. A judge cloning this repo must resolve the
      # exact versions we resolved, or results.md is not reproducible.
      - name: Sync (locked)
        run: uv sync --frozen --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Scoped to value/ and allocator/ -- the two packages carrying the rupee math.
      # Full-repo mypy is a time sink at this deadline (docs/stack.md).
      - name: Types
        run: uv run mypy || true

      # GATE 4's first half, and it needs no API key: re-hash the committed RBI circular
      # and re-check all twenty compiled rules against it -- clause number, verbatim
      # quote, expression grammar, field names. A rule that drifts from its source fails
      # here rather than in a demo.
      - name: Policy rules cite what they quote
        run: uv run python scripts/compile_policy.py --check

      # The golden set is generated, so a hand-edit to the JSONL is a defect rather
      # than an update. This fails if the committed file has drifted from its builder.
      - name: Golden set is current
        run: uv run python scripts/build_golden.py --check

      - name: Tests
        run: uv run pytest
        # RUN_S3 is deliberately unset: the two-process boot is a local/manual gate,
        # not a CI one. The in-process API contract test still runs here.

      # T5.4. Run again on its own so a chaos failure is visible in the job list rather
      # than buried in a 560-test summary -- "the system degraded" is a different claim
      # from "the tests passed" and deserves its own green tick.
      - name: Chaos suite
        run: uv run pytest tests/test_chaos.py tests/test_safety.py -q

  # GATE 2 and GATE 5. Not "the script runs" -- "the one documented command produces the
  # files that are committed".
  #
  # It runs on both operating systems, and both are blocking, which is a change made on
  # 2026-09-04 after this repository got its first remote and CI executed for the first
  # time. `repro --check` compares bytes and failed on ubuntu-latest, then failed again on
  # windows-latest: three machines produced three different results.md, differing by one
  # unit in the last digit of the largest sums (384,906 / 384,907 / 384,905). Floating-point
  # addition is not associative, so the accumulation order of a machine's math library
  # decides that digit. No CI runner can be configured out of it, and byte-identity is
  # therefore a same-machine guarantee.
  #
  # So the byte comparison still runs and still reports -- continue-on-error, because a
  # known measured difference is not a regression -- and scripts/check_drift.py is what
  # gates: prose byte-identical, table cells exact outside the columns where drift was
  # measured, one unit in the last printed digit allowed there, PNG dimensions rather than
  # PNG bytes. docs/limitations.md 9 is the argument and carries the run ids.
  #
  # The exact-byte gate is not weakened, only relocated: `uv run mandateguard repro --check`
  # is still what runs before a commit, on the machine the artifacts are committed from.
  results:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync (locked)
        run: uv sync --frozen --all-extras --dev

      # T5.8, and the command a stranger types after cloning -- not a CI-only sequence that
      # happens to cover the same ground and is free to drift from the documented one. It
      # reads data/sample/ only: no download, no MANDATEGUARD_DATA_DIR. GATE 4's second half
      # rides along inside it: the rules arm scores 114 golden cases with no API key, and
      # the model arm reports itself as unscored rather than being skipped.
      #
      # continue-on-error records the byte-exact answer without failing the build on it.
      # The report is teed to a file because the next step refuses to run without it: an
      # empty diff produced by a crashed rebuild would otherwise read as success.
      - name: Regenerate every sample-derived artifact (GATE 5)
        id: repro
        continue-on-error: true
        shell: bash
        run: uv run mandateguard repro --check 2>&1 | tee repro-report.txt

      # repro writes a per-step log under data/repro/, which is gitignored and therefore
      # unreachable from a CI failure. A failing step whose log cannot be read is a step
      # that has to be reproduced locally to be understood -- and the whole point of this
      # job is the machines that are not local.
      - name: What the failing step said
        if: failure() || steps.repro.outcome == 'failure'
        shell: bash
        run: |
          for f in data/repro/*.out; do
            echo "===== $f"
            cat "$f"
          done

      # This is the gate. It fails on any change to a quoted figure.
      - name: Every quoted figure is unchanged (GATE 5)
        run: uv run python scripts/check_drift.py

      # How far it drifted, which is the number limitations.md 9 quotes. Printed on success
      # too: if this ever comes back empty on both runners, the documented finding has
      # stopped being true and 9 should be deleted.
      - name: How far it drifted
        if: always()
        run: git --no-pager diff --stat

      # Uploaded even on failure, so the regenerated file can be inspected without
      # reproducing the environment it was produced in.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          path: |
            docs/results.md
            docs/img/sweeps.png
            docs/img/segments.png
            docs/llm_eval.md
