name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen fails if uv.lock is stale. A judge cloning this repo must resolve the
      # exact versions we resolved, or results.md is not reproducible.
      - name: Sync (locked)
        run: uv sync --frozen --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Scoped to value/ and allocator/ -- the two packages carrying the rupee math.
      # Full-repo mypy is a time sink at this deadline (docs/stack.md).
      - name: Types
        run: uv run mypy || true

      # GATE 4's first half, and it needs no API key: re-hash the committed RBI circular
      # and re-check all twenty compiled rules against it -- clause number, verbatim
      # quote, expression grammar, field names. A rule that drifts from its source fails
      # here rather than in a demo.
      - name: Policy rules cite what they quote
        run: uv run python scripts/compile_policy.py --check

      # The golden set is generated, so a hand-edit to the JSONL is a defect rather
      # than an update. This fails if the committed file has drifted from its builder.
      - name: Golden set is current
        run: uv run python scripts/build_golden.py --check

      - name: Tests
        run: uv run pytest
        # RUN_S3 is deliberately unset: the two-process boot is a local/manual gate,
        # not a CI one. The in-process API contract test still runs here.

  # GATE 2. Not "the script runs" -- "the script produces the file that is committed".
  # A stranger's fork has to regenerate results.md byte for byte, and the only way to
  # know that is to regenerate it here, on a different OS from the one it was written
  # on, and fail on any difference at all.
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync (locked)
        run: uv sync --frozen --all-extras --dev

      # Reads data/sample/ only. No download, no MANDATEGUARD_DATA_DIR: the whole point
      # of the committed slice (docs/mapping.md 4) is that this step needs nothing else.
      - name: Regenerate results.md
        run: uv run python scripts/make_results.py

      # GATE 4's second half. Needs no API key: the rules arm scores 114 golden cases
      # deterministically, and the model arm reports itself as unscored rather than
      # being skipped. No wall-clock number is written into the document, which is why
      # this diff can be byte-exact across machines.
      - name: Regenerate llm_eval.md
        run: uv run python scripts/make_llm_eval.py

      - name: Fail if the committed results drifted
        run: |
          git --no-pager diff --stat -- docs/results.md docs/img/sweeps.png docs/llm_eval.md
          git diff --exit-code -- docs/results.md docs/img/sweeps.png docs/llm_eval.md

      # Only reached when the diff is clean, so this is the regenerated file and the
      # committed one at once -- useful when the diff *is* dirty and someone needs to see
      # what CI produced without reproducing the environment.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            docs/results.md
            docs/img/sweeps.png
            docs/llm_eval.md
