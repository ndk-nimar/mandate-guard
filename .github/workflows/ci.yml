name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen fails if uv.lock is stale. A judge cloning this repo must resolve the
      # exact versions we resolved, or results.md is not reproducible.
      - name: Sync (locked)
        run: uv sync --frozen --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Scoped to value/ and allocator/ -- the two packages carrying the rupee math.
      # Full-repo mypy is a time sink at this deadline (docs/stack.md).
      - name: Types
        run: uv run mypy || true

      # GATE 4's first half, and it needs no API key: re-hash the committed RBI circular
      # and re-check all twenty compiled rules against it -- clause number, verbatim
      # quote, expression grammar, field names. A rule that drifts from its source fails
      # here rather than in a demo.
      - name: Policy rules cite what they quote
        run: uv run python scripts/compile_policy.py --check

      # The golden set is generated, so a hand-edit to the JSONL is a defect rather
      # than an update. This fails if the committed file has drifted from its builder.
      - name: Golden set is current
        run: uv run python scripts/build_golden.py --check

      - name: Tests
        run: uv run pytest
        # RUN_S3 is deliberately unset: the two-process boot is a local/manual gate,
        # not a CI one. The in-process API contract test still runs here.

      # T5.4. Run again on its own so a chaos failure is visible in the job list rather
      # than buried in a 560-test summary -- "the system degraded" is a different claim
      # from "the tests passed" and deserves its own green tick.
      - name: Chaos suite
        run: uv run pytest tests/test_chaos.py tests/test_safety.py -q

  # GATE 2 and GATE 5. Not "the script runs" -- "the one documented command produces the
  # files that are committed". A stranger's fork has to regenerate them byte for byte,
  # and the only way to know that is to regenerate them here and fail on any difference
  # at all.
  #
  # This job runs on windows-latest, and that is a narrowing of the claim rather than a
  # convenience. It ran on ubuntu-latest until 2026-09-04, the first time this repository
  # was ever pushed and therefore the first time CI had ever executed. It failed: three
  # files drifted, and the drift was real arithmetic rather than line endings -- INR
  # 413,219 became INR 413,218 and 89.805% became 89.804%, because floating-point
  # summation is not identical across platforms, while both PNGs changed size because
  # matplotlib resolves different fonts on Linux. Every figure this project actually
  # quotes was unchanged.
  #
  # So byte-identity holds on the platform that produced the committed files, and this
  # job is what proves it. The cross-platform half of the claim is not silently dropped:
  # `results-crossplatform` below still runs the same command on ubuntu, and
  # docs/limitations.md 9 records what it finds. Run 33877849865 is the origin of the
  # numbers above.
  results:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync (locked)
        run: uv sync --frozen --all-extras --dev

      # T5.8, and GATE 5's whole claim in one line. This is the command a stranger types
      # after cloning, so it is the command CI runs -- not a CI-only sequence of scripts
      # that happens to cover the same ground and is free to drift from the documented
      # one. It reads data/sample/ only: no download, no MANDATEGUARD_DATA_DIR, because
      # the point of the committed slice (docs/mapping.md 4) is that nothing else is
      # needed. --check regenerates results.md, sweeps.png, llm_eval.md and segments.png
      # and fails on a single differing byte. GATE 4's second half rides along inside it:
      # the rules arm scores 114 golden cases with no API key, and the model arm reports
      # itself as unscored rather than being skipped.
      - name: Reproduce every sample-derived artifact (GATE 5)
        run: uv run mandateguard repro --check

      # The report names what drifted; this prints how much, which is what a reader
      # actually wants when the step above has just gone red.
      - name: Show the drift
        if: failure()
        run: git --no-pager diff --stat

      # Uploaded even on failure, so the regenerated file can be inspected without
      # reproducing the environment it was produced in.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            docs/results.md
            docs/img/sweeps.png
            docs/img/segments.png
            docs/llm_eval.md

  # The other half of the claim, kept visible rather than dropped. `results` above proves
  # byte-identity on the platform the files were committed from; this proves that the
  # same command on a different platform does NOT reproduce them, which is a property of
  # floating-point arithmetic and font resolution, not of this code.
  #
  # continue-on-error, and that is the whole design: a red tick here would be reporting a
  # known, documented, measured fact as a regression. What it must never do is stop
  # reporting it -- docs/limitations.md 9 cites this job, and a claim in a document whose
  # evidence nobody re-runs is exactly what CLAUDE.md 4 forbids. If this job ever passes,
  # that is news, and limitations.md 9 is wrong and should be deleted.
  results-crossplatform:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync (locked)
        run: uv sync --frozen --all-extras --dev

      - name: Reproduce on a different OS (expected to drift)
        run: uv run mandateguard repro --check

      # The measured size of the drift, which is the number limitations.md 9 quotes.
      # Printed on success too: if it ever comes back empty, the documented finding has
      # stopped being true.
      - name: How far it drifted
        if: always()
        run: git --no-pager diff --stat

      - name: Upload the Linux-built artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-linux
          path: |
            docs/results.md
            docs/img/sweeps.png
            docs/img/segments.png
            docs/llm_eval.md
